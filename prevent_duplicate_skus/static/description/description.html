<h1>Prevent Duplicate SKUs</h1>
<p>This module prevents duplicate SKUs (<code>default_code</code>) in Odoo by validating that each product has a unique Reference Number.</p>
<ul>
    <li>Ensures data integrity.</li>
    <li>Prevents conflicts during product creation or updates.</li>
    <li>Applies to both Product Templates and Product Variants.</li>
</ul>
